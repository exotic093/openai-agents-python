name: Jarvis

on:
  push:
    branches:
      - main
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis.yml"
  pull_request:
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install jarvis with dev deps
        working-directory: jarvis
        run: uv sync --extra dev
      - name: Lint (format)
        working-directory: jarvis
        run: uv run ruff format --check jarvis tests
      - name: Lint (check)
        working-directory: jarvis
        run: uv run ruff check jarvis tests
      - name: Tests
        working-directory: jarvis
        env:
          PYTHONPATH: .
        run: uv run pytest -q tests/
