[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI assistant built on the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents[voice,realtime] @ file:///${PROJECT_ROOT}/..",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
