[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI assistant built on the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents[voice,realtime,litellm]",
    "litellm>=1.72",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

# When developing inside this monorepo, install the local Agents SDK in
# editable mode alongside Jarvis:
#   uv pip install -e .. -e .
[tool.uv.sources]
openai-agents = { path = "..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
